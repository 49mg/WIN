services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: win
      POSTGRES_PASSWORD: win
      POSTGRES_DB: win
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U win"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://win:win@db:5432/win
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
